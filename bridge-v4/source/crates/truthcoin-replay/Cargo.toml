[package]
name = "ecx-truthcoin-replay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Fail-closed Bitcoin/BMM/Truthcoin 0.17.0 replay boundary for ECX"

[features]
default = []
# Alpha currently runs the upstream non-testing one-day Decision cadence. The
# feature produces a distinct SP1 program identity and must never be confused
# with the default quarterly production profile.
truthcoin-alpha-one-day-period = []
authority-settlement = ["dep:ecx-elements-settlement"]

[dependencies]
bincode = "1.3.3"
bitcoin = { version = "0.32.5", features = ["serde"] }
blake3 = "1.8"
ecx-protocol-core = { path = "../protocol-core" }
ecx-elements-settlement = { path = "../elements-settlement", optional = true }
ecx-truthcoin-proof = { path = "../truthcoin-proof" }
ed25519-dalek = "2.1.1"
hex = "0.4"
libm = "0.2"
nalgebra = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
