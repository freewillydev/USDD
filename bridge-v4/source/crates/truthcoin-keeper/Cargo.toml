[package]
name = "ecx-truthcoin-keeper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Replaceable, non-authoritative canonical Truthcoin market keeper"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ecx-truthcoin-proof = { path = "../truthcoin-proof" }
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
libm = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.47", features = ["net"] }
