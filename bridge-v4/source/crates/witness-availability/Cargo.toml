[package]
name = "ecx-witness-availability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Encrypted, content-addressed 3-of-5 witness availability for ECX"

[features]
default = ["service"]
producer = [
    "dep:rand_core",
    "curve25519-dalek/rand_core",
    "ed25519-dalek/rand_core",
]
service = [
    "producer",
    "dep:anyhow",
    "dep:axum",
    "dep:clap",
    "dep:hex",
    "dep:fs2",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "ecx-witness-availability"
path = "src/bin/ecx-witness-availability.rs"
required-features = ["service"]

[dependencies]
anyhow = { version = "1.0", optional = true }
axum = { version = "0.8", features = ["http1", "json", "tokio"], optional = true }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4.5", features = ["derive"], optional = true }
curve25519-dalek = { version = "4.1.3", features = ["zeroize"] }
ed25519-dalek = { version = "2.1.1", features = ["zeroize"] }
hex = { version = "0.4", optional = true }
fs2 = { version = "0.4", optional = true }
hkdf = "0.12.4"
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = "=0.10.8"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync"], optional = true }
tower = { version = "0.5", features = ["limit"], optional = true }
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
