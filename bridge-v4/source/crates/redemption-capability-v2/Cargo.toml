[package]
name = "ecx-redemption-capability-v2"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "alpha-native-conversion-export"
path = "src/bin/alpha-native-conversion-export.rs"
required-features = ["native-alpha"]

[workspace]

[features]
native-alpha = ["dep:ecx-full-alpha-adapter-v3"]

[dependencies]
ecx-full-alpha-adapter-v3 = { path = "../full-alpha-adapter-v3", optional = true }
bincode = "=1.3.3"
elements = { version = "=0.25.3", features = ["serde"] }
ecx-conversion-foundation-v2 = { path = "../conversion-foundation-v2", default-features = false, features = ["ecx-btc"] }
ecx-full-consensus-validator-v2 = { path = "../full-consensus-validator-v2", features = ["full-elements"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.17"

[patch.crates-io]
secp256k1-zkp-sys = { path = "../../vendor/secp256k1-zkp-sys-0.10.1" }
