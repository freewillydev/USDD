[package]
name = "ecx-matcher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Deterministic signed CLOB matcher for the ECX/USDD perpetual market"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
axum = { version = "0.8", features = ["ws", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
ecx-protocol-core = { path = "../protocol-core", features = ["trader-archive"] }
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secp256k1 = { version = "0.29.1", features = ["std", "rand-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
