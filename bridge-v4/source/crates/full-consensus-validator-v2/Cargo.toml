[package]
name = "ecx-full-consensus-validator-v2"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bincode = "=1.3.3"
bitcoin = { version = "=0.32.5", features = ["serde"] }
elements = { version = "=0.25.3", features = ["serde"] }
ecx-sp1-consensus-interface = { path = "../../zkvm/interface", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = { version = "=0.10.8", optional = true }
thiserror = "=2.0.17"

[features]
default = ["full-elements"]
diagnostic-stages = []
full-elements = ["dep:ecx-sp1-consensus-interface", "dep:sha2"]

[dev-dependencies]
hex = "=0.4.3"
rand = "=0.8.5"
serde_json = "=1.0.145"
sha2 = "=0.10.8"
