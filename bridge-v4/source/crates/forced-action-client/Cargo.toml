[package]
name = "ecx-forced-action-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Fail-closed Elements wallet broadcaster for canonical ECX forced actions"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ecx-protocol-core = { path = "../protocol-core" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"

[dev-dependencies]
axum = "0.8"
secp256k1 = { version = "0.29.1", features = ["std"] }
