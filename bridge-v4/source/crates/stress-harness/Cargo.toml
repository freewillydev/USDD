[package]
name = "ecx-stress-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic mock-USDD margin and liquidation stress prototype"

[dependencies]
ecx-protocol-core = { path = "../protocol-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ecx-stress"
path = "src/main.rs"
