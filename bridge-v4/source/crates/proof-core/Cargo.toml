[package]
name = "ecx-proof-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Host-testable SP1 statement boundary for ECX confidential transitions"

[dependencies]
elements = "0.25.3"
bincode = "1.3.3"
ecx-elements-settlement = { path = "../elements-settlement" }
ecx-protocol-core = { path = "../protocol-core" }
ecx-truthcoin-proof = { path = "../truthcoin-proof" }
ecx-witness-availability = { path = "../witness-availability", default-features = false }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
ecx-truthcoin-replay = { path = "../truthcoin-replay" }
hex = "0.4"
ecx-matcher = { path = "../matcher" }
ecx-parent-enforcer = { path = "../parent-enforcer" }
ecx-stress-harness = { path = "../stress-harness" }
ecx-witness-availability = { path = "../witness-availability", default-features = false, features = ["producer"] }
libm = "0.2"
rand = "0.8"
secp256k1 = { version = "0.29.1", features = ["std"] }
tempfile = "3.13"
