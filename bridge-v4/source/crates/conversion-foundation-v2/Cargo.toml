[package]
name = "ecx-conversion-foundation-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Provenance-pinned Bitcoin and Sepolia verification foundation for ECX V2 conversion proofs"

# This provenance adapter is deliberately isolated from the main workspace.
# The audited USDD revision pins sha2 0.10.8 exactly, while the ECX workspace
# has already frozen sha2 0.10.9 for its proof programs. Isolation preserves
# both source graphs instead of silently rewriting either one.
[workspace]

[dependencies]
alloy-primitives = { version = "=1.3.1", default-features = false, features = ["rlp", "sha3-keccak", "std"], optional = true }
alloy-rlp = { version = "=0.3.12", default-features = false, features = ["std"], optional = true }
alloy-trie = { version = "=0.9.1", default-features = false, features = ["ethereum", "std"], optional = true }
bincode = "=1.3.3"
elements = { version = "=0.25.3", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.8"
thiserror = "2.0"
usdd-bitcoin-bmm = { git = "https://github.com/ekulkisnek/USDD.git", rev = "2c9dc7a72052240613deba3d9cf52a43403368d4", default-features = false, features = ["std"], optional = true }
usdd-bitcoin-bmm-ecx-v2 = { package = "usdd-bitcoin-bmm", git = "https://github.com/ekulkisnek/USDD.git", rev = "a0a72d1abf4687172b77175af8c90758fe43e028", default-features = false, features = ["std"], optional = true }
usdd-core = { git = "https://github.com/ekulkisnek/USDD.git", rev = "2c9dc7a72052240613deba3d9cf52a43403368d4", default-features = false, features = ["std"], optional = true }
usdd-ethereum-inbound = { git = "https://github.com/ekulkisnek/USDD.git", rev = "2c9dc7a72052240613deba3d9cf52a43403368d4", default-features = false, features = ["std", "helios-finality"], optional = true }

[[bin]]
name = "ecx-btc-conversion-witness-export"
path = "src/bin/ecx-btc-conversion-witness-export.rs"
required-features = ["exporter"]

[[bin]]
name = "ecx-btc-conversion-prove"
path = "src/bin/ecx-btc-conversion-prove.rs"
required-features = ["prover"]

[[bin]]
name = "usdd-usd-ethereum-witness-export"
path = "src/bin/usdd-usd-ethereum-witness-export.rs"
required-features = ["exporter"]

[[bin]]
name = "usdd-usd-ethereum-source-prove"
path = "src/bin/usdd-usd-ethereum-source-prove.rs"
required-features = ["prover"]

[[bin]]
name = "sp1-program-identity"
path = "src/bin/sp1-program-identity.rs"
required-features = ["prover"]

[[bin]]
name = "alpha-parent-execute-exact"
path = "src/bin/alpha-parent-execute-exact.rs"
required-features = ["prover"]

[[bin]]
name = "alpha-checkpoint-execute-only"
path = "src/bin/alpha-checkpoint-execute-only.rs"
required-features = ["prover"]

[[bin]]
name = "sp1-recursive-execute-exact"
path = "src/bin/sp1-recursive-execute-exact.rs"
required-features = ["prover"]

[[bin]]
name = "sp1-segment-execute-exact"
path = "src/bin/sp1-segment-execute-exact.rs"
required-features = ["prover"]

[[bin]]
name = "sp1-segment-prove-exact"
path = "src/bin/sp1-segment-prove-exact.rs"
required-features = ["prover"]

[[bin]]
name = "usdd-manifest-binding-export"
path = "src/bin/usdd-manifest-binding-export.rs"
required-features = ["exporter", "usdd-ethereum"]

[[bin]]
name = "sepolia-test-dollar-mpt-check"
path = "src/bin/sepolia-test-dollar-mpt-check.rs"
required-features = ["exporter", "usdd-ethereum"]

[features]
default = ["bitcoin-foundation", "ecx-btc", "usdd-ethereum"]
bitcoin-foundation = ["dep:usdd-bitcoin-bmm"]
ecx-btc = ["dep:elements", "dep:usdd-bitcoin-bmm-ecx-v2"]
usdd-ethereum = [
    "dep:alloy-primitives",
    "dep:alloy-rlp",
    "dep:alloy-trie",
    "dep:usdd-core",
    "dep:usdd-ethereum-inbound",
]
exporter = ["dep:serde_json"]
prover = ["dep:anyhow", "dep:clap", "dep:sp1-sdk", "dep:tokio"]

[dependencies.anyhow]
version = "=1.0.100"
optional = true

[dependencies.clap]
version = "=4.5.53"
features = ["derive"]
optional = true

[dependencies.sp1-sdk]
version = "=6.3.1"
optional = true

[dependencies.tokio]
version = "=1.48.0"
features = ["macros", "rt-multi-thread"]
optional = true

[dependencies.serde_json]
version = "=1.0.145"
optional = true

[patch.crates-io]
ethereum_hashing = { path = "../../vendor/ethereum-hashing-0.7.0-ecx" }
sp1-prover = { path = "../../vendor/sp1-prover-6.3.1-ecx" }
secp256k1-zkp-sys = { path = "../../vendor/secp256k1-zkp-sys-0.10.1" }
