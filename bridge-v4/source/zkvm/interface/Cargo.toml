[package]
name = "ecx-sp1-consensus-interface"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
default = []
# Production verifier. `sp1-backend` is retained as a compatibility alias.
sp1-backend = ["sp1-groth16-backend"]
sp1-groth16-backend = [
    "dep:slop-algebra",
    "dep:sp1-hypercube",
    "dep:sp1-primitives",
    "dep:sp1-verifier",
]
# Integrity-only debugging profile. Never enable this in consensus builds for
# confidential positions: SP1 6.3.1's compressed proof path is not the audited
# zero-knowledge Groth16 wrapper.
debug-compressed-backend = [
    "dep:bincode",
    "dep:slop-algebra",
    "dep:sp1-primitives",
    "dep:sp1-recursion-executor",
    "dep:sp1-verifier",
]

[dependencies]
sha2 = "=0.10.8"
bincode = { version = "1.3.3", optional = true }
slop-algebra = { version = "=6.3.1", optional = true }
sp1-hypercube = { version = "=6.3.1", optional = true }
sp1-primitives = { version = "=6.3.1", optional = true }
sp1-recursion-executor = { version = "=6.3.1", optional = true }
sp1-verifier = { version = "=6.3.1", optional = true, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "print_sp1_groth16_pins"
required-features = ["sp1-groth16-backend"]
