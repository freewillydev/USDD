[package]
name = "ecx-protocol-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Deterministic protocol core for the ECX/USDD perpetual futures exchange"

[features]
default = ["serde"]
serde = ["dep:serde"]
trader-archive = []
prediction-market-guest = ["dep:k256"]

[dependencies]
crypto-bigint = { version = "=0.5.5", default-features = false }
num-bigint = { version = "0.4.6", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"], optional = true }
secp256k1 = { version = "0.29.1", features = ["std"] }
serde = { version = "1.0.210", features = ["derive"], optional = true }
sha2 = "0.10.8"
thiserror = "1.0.63"

[dev-dependencies]
bincode = "1.3.3"
num-traits = "0.2.19"
serde_json = "1.0.128"
